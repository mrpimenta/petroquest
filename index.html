<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d4b3e">
  <meta name="description" content="Petro Quest: simulados comentados de Engenharia Elétrica para provas Transpetro/Cesgranrio.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Petro Quest</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" type="button" data-view="dashboard" aria-label="Voltar ao início">
      <span class="brand-mark" aria-hidden="true">PQ</span>
      <span><strong>Petro Quest</strong><small>Engenharia Elétrica · Cesgranrio</small></span>
    </button>
    <div class="top-actions">
      <span id="offline-status" class="status" aria-live="polite">verificando conexão</span>
    </div>
  </header>

  <main id="app" class="shell">
    <section class="intro">
      <div>
        <h1>Aprenda resolvendo as provas.</h1>
        <p>Prova por prova, matéria por matéria, com revisão dos erros e resolução comentada.</p>
      </div>
      <button id="start-session" class="primary compact" type="button">Continuar estudo</button>
    </section>

    <section id="stats" class="stats" aria-label="Resumo do progresso"></section>

    <nav class="tabs" aria-label="Áreas do aplicativo">
      <button class="tab active" data-view="dashboard" type="button">Provas</button>
      <button class="tab" data-view="quiz" type="button">Simulado</button>
      <button class="tab" data-view="review" type="button">Revisão</button>
      <button class="tab" data-view="syllabus" type="button">Matérias</button>
    </nav>

    <section id="view" class="view" aria-live="polite"></section>
  </main>

  <noscript>Ative o JavaScript para usar o Petro Quest.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
